<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkFeed</title>
  <link rel="stylesheet" href="style.css">
  <!-- Preconnect to fonts if we decide to use them later, for now system fonts are fine but we prepare the structure -->
</head>

<body>
  <div class="app-background"></div>
  <div class="container">
    <header class="header">
      <div class="title-group">
        <div class="logo-icon">
          <img src="../icons/logo48.png" alt="App Logo" class="app-logo">
        </div>
        <h1 id="i18n-title">LinkFeed</h1>
        <p id="i18n-slogan" class="slogan">Don't copy-paste, just feed it.</p>
      </div>
      <button id="langToggle" class="lang-button" title="Switch Language" aria-label="Switch Language">
        <span class="lang-text">CN</span>
      </button>
    </header>

    <main class="content">
      <div class="ai-grid" id="aiGrid">
        <!-- AI service buttons will be dynamically inserted here -->
      </div>
    </main>

    <footer class="footer">
      <span id="appVersion" class="version-text"></span>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>

</html>
